name: Build Azkari 2027 APK (Android 16)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 36 / Android 16)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename Output APK
        run: cp app/build/outputs/apk/release/app-release.apk Azkari-2027-Android16-Signed.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azkari-2027-Android16-APK
          path: Azkari-2027-Android16-Signed.apk
          retention-days: 90
